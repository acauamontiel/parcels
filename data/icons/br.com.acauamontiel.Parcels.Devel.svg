<!-- Parcels app icon: a parcel with a download badge. Follows the GNOME app icon guidelines (128 px grid, GNOME palette). Devel profile. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Front: a little darker towards the bottom -->
    <linearGradient id="front" x1="0" y1="46" x2="0" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8a073"/>
      <stop offset="1" stop-color="#a87650"/>
    </linearGradient>
    <!-- Side lighting on the rounded vertical edges, as in other GNOME app icons -->
    <linearGradient id="edges" x1="14" y1="0" x2="114" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#63452c" stop-opacity="0.3"/>
      <stop offset="0.03" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.08" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.97" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#63452c" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="24" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2c29e"/>
      <stop offset="1" stop-color="#d8b48c"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="62" x2="0" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
  </defs>
  <!-- Front -->
  <path d="M14 46h100v58a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8z" fill="url(#front)"/>
  <path d="M14 46h100v58a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8z" fill="url(#edges)"/>
  <!-- Lid, seen from slightly above -->
  <path d="M25 24h78a5 5 0 0 1 4.6 3l6.4 19H14l6.4-19a5 5 0 0 1 4.6-3z" fill="url(#lid)"/>
  <!-- Fold between lid and front -->
  <path d="M14 46h100v2H14z" fill="#f0d9bd" opacity="0.7"/>
  <!-- Tape -->
  <path d="M56 24h16l3 22H53z" fill="#ecd3b4"/>
  <path d="M53 46h22v24a2 2 0 0 1-2 2H55a2 2 0 0 1-2-2z" fill="#d6b18a"/>
  <!-- Shipping label -->
  <rect x="24" y="62" width="22" height="17" rx="2" fill="#f6f5f4"/>
  <rect x="28" y="67" width="14" height="2" rx="1" fill="#9a9996"/>
  <rect x="28" y="72" width="9" height="2" rx="1" fill="#9a9996"/>
  <!-- Development build: stripes across the bottom of the box -->
  <clipPath id="bottom"><path d="M14 98h100v6a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8z"/></clipPath>
  <g clip-path="url(#bottom)">
    <path d="M14 98h100v14H14z" fill="#241f31"/>
    <path fill="#f6f5f4" d="m18 98-7 14h7l7-14zm14 0-7 14h7l7-14zm14 0-7 14h7l7-14zm14 0-7 14h7l7-14zm14 0-7 14h7l7-14zm14 0-7 14h7l7-14zm14 0-7 14h7l7-14zm14 0-7 14h7l7-14z"/>
  </g>
  <!-- Download badge -->
  <circle cx="92" cy="86" r="24" fill="#1a5fb4"/>
  <circle cx="92" cy="84" r="22" fill="url(#badge)"/>
  <path d="M88 70h8v14h8l-12 13-12-13h8z" fill="#ffffff"/>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run cargo fmt
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

  flatpak:
    name: Flatpak (build, clippy, tests)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          bundle: parcels-devel.flatpak
          manifest-path: build-aux/br.com.acauamontiel.Parcels.Devel.json
          run-tests: true
          cache-key: flatpak-builder-${{ github.sha }}

  lint:
    name: Flatpak manifest lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run flatpak-builder-lint
        run: flatpak-builder-lint manifest build-aux/br.com.acauamontiel.Parcels.Devel.json
